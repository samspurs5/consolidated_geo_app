# Mosquitto config for the local live-feed broker.
#
# This is the closed-network default: anonymous publish/subscribe on
# the docker network only — the broker is never exposed on the host.
# For production, switch to password files + TLS.

persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous true

log_dest stdout
log_type warning
log_type error
log_type notice
