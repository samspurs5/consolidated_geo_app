# One source of truth: ./data/osm/region.pbf
# Both GraphHopper and Overpass initialise from this file.
# The API service manages delta updates (osmium apply-changes) and
# coordinates container restarts so both services stay in sync.
# All services work fully offline once data is loaded.

services:

  # ── Overpass API ──────────────────────────────────────────────
  overpass:
    image: wiktorn/overpass-api:latest
    container_name: overpass
    restart: unless-stopped
    # The wiktorn image's /db is the overpass user's home dir (mode 0700).
    # When Docker creates the named volume it inherits that mode, leaving
    # the dispatcher socket at /db/db/osm3s_osm_base unreachable to the
    # `nginx` user that fcgiwrap runs as → every query returns
    # "Permission denied … Unix_Socket". Open up the traversal bit.
    entrypoint:
      - /bin/bash
      - -c
      - "chmod 0755 /db && exec /app/docker-entrypoint.sh"
    environment:
      # init  → build DB from PBF on first start (file must exist)
      # rules → load existing DB on subsequent starts
      OVERPASS_MODE: ${OVERPASS_MODE:-init}
      OVERPASS_META: ${OVERPASS_META:-yes}
      OVERPASS_PLANET_URL: "file:///data/osm/region.pbf"
      # The wiktorn/overpass-api entrypoint always copies the URL into
      # /db/planet.osm.bz2 (by name, not by content). Since our source is
      # actually a PBF, rename it back and convert to true osm.bz2 with osmium
      # before update_database runs. osmium-tool is bundled in the image.
      OVERPASS_PLANET_PREPROCESS: "mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm -f /db/planet.osm.pbf"
      # Leave blank to disable automatic network-based diff fetching
      OVERPASS_DIFF_URL: ${OVERPASS_DIFF_URL:-}
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_MAX_TIMEOUT: "1000"
      OVERPASS_SPACE: ${OVERPASS_SPACE:-4294967296}   # 4 GiB DB space
    volumes:
      - osm-data:/data/osm:ro          # read PBF from shared volume
      - overpass-db:/db                # Overpass internal database
    networks:
      - geo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/api/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s               # large region init can take minutes

  # ── GraphHopper (Israel Hiking Maps build) ───────────────────
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: graphhopper
    restart: unless-stopped
    environment:
      JAVA_OPTS: "${GH_JAVA_OPTS:--Xmx2g -Xms512m -XX:+UseG1GC}"
    # The image's default entrypoint hardcodes `-c config-example.yml` and
    # never sets the input PBF, so GraphHopper would fail with
    # "cannot use file for DataReader as it wasn't specified".
    # Override to point at the bundled (v12-compatible) config and our PBF.
    entrypoint: ["./graphhopper.sh"]
    command:
      - "-c"
      - "/graphhopper/config-example.yml"
      - "-i"
      - "/data/osm/region.pbf"
      - "-o"
      - "/data/default-gh"
    volumes:
      - osm-data:/data/osm:ro                        # read PBF
      - ./data/default-gh:/data/default-gh           # pre-built graph cache (bind-mount)
      # Override the bundled config (which forces SRTM elevation downloads)
      # with an offline-friendly version. The entrypoint already passes
      # `-c config-example.yml`, so we shadow the file in place.
      - ./graphhopper/config.yml:/graphhopper/config-example.yml:ro
    networks:
      - geo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # ── Ollama (local LLM for the chat assistant) ────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      # Keep the model loaded in VRAM/RAM indefinitely so chat replies
      # don't cold-start on every request.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-data:/root/.ollama       # persist downloaded models
    networks:
      - geo-net
    # Pull the configured model on first start, then run the server.
    # Idempotent — `ollama pull` is a no-op if the model is already cached.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        SERVER_PID=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "${OLLAMA_MODEL:-qwen2.5:7b}" || true
        wait $$SERVER_PID

  # ── Unified API ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: geo-api
    restart: unless-stopped
    environment:
      GRAPHHOPPER_URL: "http://graphhopper:8989"
      OVERPASS_URL: "http://overpass/api"
      OSM_DATA_DIR: "/data/osm"
      OSM_PBF_FILE: "${OSM_PBF_FILE:-region.pbf}"
      # Replication endpoint – only used if the environment has internet.
      # Leave empty or point to a local mirror for air-gapped setups.
      REPLICATION_URL: "${REPLICATION_URL:-https://planet.openstreetmap.org/replication/minute}"
      OVERPASS_CONTAINER: "overpass"
      GRAPHHOPPER_CONTAINER: "graphhopper"
      OVERPASS_DB_VOLUME: "consolidated_geo_app_overpass-db"
      GRAPHHOPPER_CACHE_DIR: "/data/default-gh"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
    volumes:
      - osm-data:/data/osm              # read + write (delta application)
      - ./data/tiles:/data/tiles:ro     # vector tiles (.pmtiles) for the frontend
      - /var/run/docker.sock:/var/run/docker.sock   # restart sibling containers
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - overpass
      - graphhopper
      - ollama
    networks:
      - geo-net

volumes:
  # Bind-mount so the operator can drop a .pbf directly into ./data/osm/
  osm-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/osm

  # Named volume – managed by Docker; persist across restarts
  overpass-db:

  # Persists pulled Ollama models between container recreations
  ollama-data:

networks:
  geo-net:
    driver: bridge
