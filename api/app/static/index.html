<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSM Geo App</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: white; padding: 12px 14px; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 300px;
      max-height: calc(100vh - 24px); overflow-y: auto;
    }
    #panel h1 { font-size: 14px; margin: 0 0 8px 0; }
    #panel label { display: block; font-size: 12px; color: #555; margin-top: 6px; }
    #panel input, #panel select, #panel textarea {
      width: 100%; box-sizing: border-box; padding: 4px 6px;
      font-family: monospace; font-size: 12px;
    }
    #panel textarea { resize: vertical; height: 60px; }
    .row { display: flex; gap: 6px; }
    .row > * { flex: 1; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .actions button {
      padding: 5px 10px; font-size: 12px; cursor: pointer;
      border: 1px solid #888; background: #f4f4f4; border-radius: 4px;
    }
    .actions button:hover { background: #e8e8e8; }
    #status { margin-top: 8px; font-size: 12px; color: #444; min-height: 1em; }
    #status.error { color: #c00; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; }
    .sep { margin: 12px -14px 6px -14px; border: 0; border-top: 1px solid #eee; }
    #chat-log {
      height: 160px; overflow-y: auto; border: 1px solid #ddd;
      padding: 6px; background: #fafafa; font-size: 12px; border-radius: 4px;
    }
    #chat-log .msg { margin: 3px 0; line-height: 1.35; }
    #chat-log .you { color: #225; }
    #chat-log .bot { color: #052; }
    #chat-log .err { color: #c00; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>OSM Geo App</h1>

    <label>From <small style="color:#888">(lat, lng)</small></label>
    <input id="from" placeholder="click on map" />
    <label>To</label>
    <input id="to" placeholder="click on map (route only)" />

    <div class="row">
      <div>
        <label>Profile</label>
        <select id="profile">
          <option value="car">car</option>
          <option value="foot">foot</option>
          <option value="bike">bike</option>
        </select>
      </div>
      <div>
        <label>Iso minutes</label>
        <input id="minutes" type="number" min="1" value="10" />
      </div>
    </div>

    <label>Overpass QL <small style="color:#888">({{bbox}} = visible map)</small></label>
    <textarea id="ql">node[amenity=restaurant]({{bbox}});out body;</textarea>

    <div class="actions">
      <button id="route-btn">Route</button>
      <button id="iso-btn">Isochrone</button>
      <button id="ovp-btn">Overpass</button>
      <button id="clear-btn">Clear</button>
    </div>

    <div id="status"></div>
    <div class="hint">Click map to set From, click again for To.</div>

    <hr class="sep" />
    <label>Chat <small style="color:#888">(local LLM via Ollama)</small></label>
    <div id="chat-log"></div>
    <div class="row" style="margin-top: 6px;">
      <input id="chat-input" placeholder="ask about routes, places, areas…" style="flex: 3;" />
      <button id="chat-send" style="flex: 1;">Send</button>
    </div>
  </div>
  <div id="map"></div>

  <script src="vendor/pmtiles.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: "map",
      style: "style.json",
      center: [7.42, 43.74],
      zoom: 13,
    });
    map.addControl(new maplibregl.NavigationControl());

    let fromLngLat = null, toLngLat = null;
    let fromMarker = null, toMarker = null;
    const statusEl = document.getElementById("status");
    const fromInput = document.getElementById("from");
    const toInput = document.getElementById("to");

    const fmt = ll => `${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`;
    const parsePt = s => {
      const m = (s || "").match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
    };
    const setStatus = (text, isError = false) => {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", !!isError);
    };

    map.on("click", e => {
      if (!fromLngLat) {
        fromLngLat = e.lngLat;
        fromInput.value = fmt(e.lngLat);
        fromMarker = new maplibregl.Marker({ color: "#22a" }).setLngLat(e.lngLat).addTo(map);
      } else if (!toLngLat) {
        toLngLat = e.lngLat;
        toInput.value = fmt(e.lngLat);
        toMarker = new maplibregl.Marker({ color: "#a22" }).setLngLat(e.lngLat).addTo(map);
      }
    });

    // ── overlay management ───────────────────────────────────────
    const OVERLAYS = {
      route: { layers: ["route"], source: "route" },
      iso:   { layers: ["iso-fill", "iso-outline"], source: "iso" },
      ovp:   { layers: ["ovp-lines", "ovp-points"], source: "ovp" },
    };

    const removeOverlay = key => {
      for (const id of OVERLAYS[key].layers) if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(OVERLAYS[key].source)) map.removeSource(OVERLAYS[key].source);
    };

    const setOverlay = (key, geojson, layerDefs) => {
      removeOverlay(key);
      map.addSource(OVERLAYS[key].source, { type: "geojson", data: geojson });
      for (const def of layerDefs) map.addLayer({ ...def, source: OVERLAYS[key].source });
    };

    const LAYER_DEFS = {
      route: [
        { id: "route", type: "line", paint: { "line-color": "#d33", "line-width": 4 } },
      ],
      iso: [
        { id: "iso-fill",    type: "fill", paint: { "fill-color": "#22a", "fill-opacity": 0.2 } },
        { id: "iso-outline", type: "line", paint: { "line-color": "#22a", "line-width": 2 } },
      ],
      ovp: [
        { id: "ovp-lines",  type: "line",   filter: ["==", ["geometry-type"], "LineString"],
          paint: { "line-color": "#093", "line-width": 2 } },
        { id: "ovp-points", type: "circle", filter: ["==", ["geometry-type"], "Point"],
          paint: { "circle-radius": 5, "circle-color": "#093", "circle-stroke-color": "#fff", "circle-stroke-width": 1 } },
      ],
    };
    const drawOverlay = (kind, geojson) => setOverlay(kind, geojson, LAYER_DEFS[kind]);

    document.getElementById("clear-btn").onclick = () => {
      fromLngLat = toLngLat = null;
      fromInput.value = toInput.value = "";
      if (fromMarker) { fromMarker.remove(); fromMarker = null; }
      if (toMarker) { toMarker.remove(); toMarker = null; }
      for (const k of Object.keys(OVERLAYS)) removeOverlay(k);
      setStatus("");
    };

    // ── 1. Route ─────────────────────────────────────────────────
    document.getElementById("route-btn").onclick = async () => {
      const a = parsePt(fromInput.value), b = parsePt(toInput.value);
      if (!a || !b) return setStatus("Set both points first.", true);
      setStatus("Routing…");
      try {
        const res = await fetch("/route", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ points: [a, b], profile: profileVal(), points_encoded: false }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const path = (await res.json()).paths?.[0];
        if (!path) throw new Error("no path");
        drawOverlay("route", { type: "Feature", geometry: path.points });
        setStatus(`${(path.distance / 1000).toFixed(2)} km, ${(path.time / 60000).toFixed(1)} min`);
        if (path.bbox) map.fitBounds([[path.bbox[0], path.bbox[1]], [path.bbox[2], path.bbox[3]]], { padding: 60 });
      } catch (err) { setStatus(err.message, true); }
    };

    // ── 2. Isochrone ─────────────────────────────────────────────
    document.getElementById("iso-btn").onclick = async () => {
      const a = parsePt(fromInput.value);
      if (!a) return setStatus("Set From first.", true);
      const minutes = parseFloat(document.getElementById("minutes").value);
      if (!minutes || minutes <= 0) return setStatus("Enter minutes.", true);
      setStatus("Computing isochrone…");
      try {
        const res = await fetch("/route/isochrone", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat: a[0], lon: a[1], profile: profileVal(), time_limit: Math.round(minutes * 60), buckets: 1 }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        const polys = data.polygons || [];
        if (!polys.length) throw new Error("no polygons returned");
        drawOverlay("iso", { type: "FeatureCollection", features: polys });
        setStatus(`${minutes} min reachable area`);
      } catch (err) { setStatus(err.message, true); }
    };

    // ── 3. Overpass ──────────────────────────────────────────────
    document.getElementById("ovp-btn").onclick = async () => {
      let ql = document.getElementById("ql").value.trim();
      if (!ql) return setStatus("Enter an Overpass QL query.", true);
      // Substitute {{bbox}} with the current map view (Overpass order: south,west,north,east)
      const b = map.getBounds();
      ql = ql.replaceAll("{{bbox}}", `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`);
      setStatus("Querying Overpass…");
      try {
        const res = await fetch("/overpass/query", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: ql, output: "json" }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        const fc = elementsToFeatureCollection(data.elements || []);
        drawOverlay("ovp", fc);
        setStatus(`${fc.features.length} feature${fc.features.length === 1 ? "" : "s"}`);
      } catch (err) { setStatus(err.message, true); }
    };

    // Minimal Overpass→GeoJSON: nodes → Point; ways/relations with `out geom;` → LineString.
    function elementsToFeatureCollection(elements) {
      const features = [];
      for (const el of elements) {
        if (el.type === "node" && el.lat != null && el.lon != null) {
          features.push({ type: "Feature", properties: el.tags || {},
            geometry: { type: "Point", coordinates: [el.lon, el.lat] } });
        } else if (el.geometry && Array.isArray(el.geometry)) {
          features.push({ type: "Feature", properties: el.tags || {},
            geometry: { type: "LineString", coordinates: el.geometry.map(g => [g.lon, g.lat]) } });
        }
      }
      return { type: "FeatureCollection", features };
    }

    function profileVal() { return document.getElementById("profile").value; }

    // ── 4. Chat ──────────────────────────────────────────────────
    const chatHistory = [];
    const chatLog = document.getElementById("chat-log");
    const chatInput = document.getElementById("chat-input");
    const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const appendMsg = (cls, label, text) => {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.innerHTML = `<b>${label}:</b> ${escapeHtml(text)}`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    };

    async function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      chatHistory.push({ role: "user", content: text });
      appendMsg("you", "you", text);
      setStatus("Thinking…");
      try {
        const b = map.getBounds();
        const res = await fetch("/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: chatHistory,
            bbox: [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()],
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        chatHistory.push({ role: "assistant", content: data.reply });
        appendMsg("bot", "bot", data.reply || "(no reply)");
        for (const ov of data.overlays || []) {
          if (LAYER_DEFS[ov.kind]) drawOverlay(ov.kind, ov.geojson);
        }
        setStatus("");
      } catch (err) {
        appendMsg("err", "err", err.message);
        setStatus(err.message, true);
      }
    }
    document.getElementById("chat-send").onclick = sendChat;
    chatInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
  </script>
</body>
</html>
