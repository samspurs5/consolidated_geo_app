<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSM Geo App</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: white; padding: 12px 14px; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 300px;
      max-height: calc(100vh - 24px); overflow-y: auto;
    }
    #panel h1 { font-size: 14px; margin: 0 0 8px 0; }
    #panel label { display: block; font-size: 12px; color: #555; margin-top: 6px; }
    #panel input, #panel select, #panel textarea {
      width: 100%; box-sizing: border-box; padding: 4px 6px;
      font-family: monospace; font-size: 12px;
    }
    #panel textarea { resize: vertical; height: 60px; }
    .row { display: flex; gap: 6px; }
    .row > * { flex: 1; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .actions button {
      padding: 5px 10px; font-size: 12px; cursor: pointer;
      border: 1px solid #888; background: #f4f4f4; border-radius: 4px;
    }
    .actions button:hover { background: #e8e8e8; }
    #status { margin-top: 8px; font-size: 12px; color: #444; min-height: 1em; }
    #status.error { color: #c00; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; }
    .sep { margin: 12px -14px 6px -14px; border: 0; border-top: 1px solid #eee; }
    #chat-log {
      height: 160px; overflow-y: auto; border: 1px solid #ddd;
      padding: 6px; background: #fafafa; font-size: 12px; border-radius: 4px;
    }
    #chat-log .msg { margin: 3px 0; line-height: 1.35; }
    #chat-log .you { color: #225; }
    #chat-log .bot { color: #052; }
    #chat-log .err { color: #c00; }
    #chat-log .tool {
      color: #555; background: #eef; border-left: 3px solid #88a;
      padding: 2px 6px; margin: 3px 0; font-family: monospace;
      font-size: 11px; white-space: pre-wrap; word-break: break-word;
    }
    #chat-log .tool .name { color: #225; font-weight: bold; }
    #chat-log .tool .res { color: #052; }
    #chat-log .tool .err { color: #c00; }

    /* Right-side panel: live POIs in the current viewport */
    #poi-panel {
      position: absolute; top: 12px; right: 12px; z-index: 1;
      background: white; padding: 12px 14px; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 240px;
      max-height: calc(100vh - 24px); display: flex; flex-direction: column;
    }
    #poi-panel h2 { font-size: 13px; margin: 0 0 6px 0; display: flex; justify-content: space-between; }
    #poi-panel h2 .count { color: #888; font-weight: normal; font-size: 11px; }
    #poi-status { font-size: 11px; color: #888; min-height: 1em; margin-bottom: 6px; }
    #poi-list { flex: 1; overflow-y: auto; font-size: 12px; border-top: 1px solid #eee; }
    .poi-row { padding: 5px 6px; border-bottom: 1px solid #eee; cursor: pointer; }
    .poi-row:hover { background: #f4f4f8; }
    .poi-row .name { font-weight: 600; color: #225; }
    .poi-row .kind { color: #888; font-size: 11px; }

    /* Feature popup styling */
    .maplibregl-popup-content { padding: 8px 10px; max-width: 320px; }
    .feature-popup { font-family: monospace; font-size: 11px; line-height: 1.45; }
    .feature-popup .k { color: #225; font-weight: 600; margin-right: 4px; }
    .feature-popup .v { color: #333; word-break: break-all; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>OSM Geo App</h1>

    <label>From <small style="color:#888">(lat, lng)</small></label>
    <input id="from" placeholder="click on map" />
    <label>To</label>
    <input id="to" placeholder="click on map (route only)" />

    <div class="row">
      <div>
        <label>Profile</label>
        <select id="profile">
          <option value="car">car</option>
          <option value="foot">foot</option>
          <option value="bike">bike</option>
        </select>
      </div>
      <div>
        <label>Iso minutes</label>
        <input id="minutes" type="number" min="1" value="10" />
      </div>
    </div>

    <label>Overpass QL <small style="color:#888">({{bbox}} = visible map)</small></label>
    <textarea id="ql">node[amenity=restaurant]({{bbox}});out body;</textarea>

    <div class="actions">
      <button id="route-btn">Route</button>
      <button id="iso-btn">Isochrone</button>
      <button id="ovp-btn">Overpass</button>
      <button id="clear-btn">Clear</button>
    </div>

    <div id="status"></div>
    <div class="hint">Click map to set From, click again for To.</div>

    <hr class="sep" />
    <label>Chat <small style="color:#888">(local LLM via Ollama)</small></label>
    <div id="chat-log"></div>
    <div class="row" style="margin-top: 6px;">
      <input id="chat-input" placeholder="ask about routes, places, areas…" style="flex: 3;" />
      <button id="chat-send" style="flex: 1;">Send</button>
    </div>
  </div>

  <div id="poi-panel">
    <h2>Points in view <span class="count" id="poi-count"></span></h2>
    <div id="poi-status">Pan or zoom to load POIs</div>
    <div id="poi-list"></div>
  </div>

  <div id="map"></div>

  <script src="vendor/pmtiles.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: "map",
      style: "style.json",
      center: [7.42, 43.74],
      zoom: 13,
    });
    map.addControl(new maplibregl.NavigationControl(), "bottom-right");

    let fromLngLat = null, toLngLat = null;
    let fromMarker = null, toMarker = null;
    const statusEl = document.getElementById("status");
    const fromInput = document.getElementById("from");
    const toInput = document.getElementById("to");

    const fmt = ll => `${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`;
    const parsePt = s => {
      const m = (s || "").match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
    };
    const setStatus = (text, isError = false) => {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", !!isError);
    };

    // Layers we expose for click-to-popup. Even if they don't exist yet
    // (overlays are added on demand), MapLibre handles the binding lazily.
    const INTERACTIVE_LAYERS = [
      "ovp-points", "ovp-lines", "tour-stops", "tour-line", "route",
      "iso-fill", "iso-outline",
    ];

    const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    function showFeaturePopup(lngLat, props) {
      const entries = Object.entries(props || {}).filter(([, v]) => v !== null && v !== "");
      const html = entries.length
        ? entries.map(([k, v]) => `<div><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`).join("")
        : "<i>(no tags)</i>";
      new maplibregl.Popup({ maxWidth: "320px", closeButton: true })
        .setLngLat(lngLat)
        .setHTML(`<div class="feature-popup">${html}</div>`)
        .addTo(map);
    }
    for (const id of INTERACTIVE_LAYERS) {
      map.on("click", id, e => {
        if (!e.features?.length) return;
        showFeaturePopup(e.lngLat, e.features[0].properties);
      });
      map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; });
    }

    map.on("click", e => {
      // Skip from/to setting when the user clicks an existing feature —
      // the per-layer click handler above will pop the tags instead.
      const hits = map.queryRenderedFeatures(e.point, { layers: INTERACTIVE_LAYERS });
      if (hits.length) return;
      if (!fromLngLat) {
        fromLngLat = e.lngLat;
        fromInput.value = fmt(e.lngLat);
        fromMarker = new maplibregl.Marker({ color: "#22a" }).setLngLat(e.lngLat).addTo(map);
      } else if (!toLngLat) {
        toLngLat = e.lngLat;
        toInput.value = fmt(e.lngLat);
        toMarker = new maplibregl.Marker({ color: "#a22" }).setLngLat(e.lngLat).addTo(map);
      }
    });

    // ── overlay management ───────────────────────────────────────
    const OVERLAYS = {
      route: { layers: ["route"], source: "route" },
      iso:   { layers: ["iso-fill", "iso-outline"], source: "iso" },
      ovp:   { layers: ["ovp-lines", "ovp-points"], source: "ovp" },
      tour:  { layers: ["tour-line", "tour-stops"], source: "tour" },
    };

    const removeOverlay = key => {
      for (const id of OVERLAYS[key].layers) if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(OVERLAYS[key].source)) map.removeSource(OVERLAYS[key].source);
    };

    const setOverlay = (key, geojson, layerDefs) => {
      removeOverlay(key);
      map.addSource(OVERLAYS[key].source, { type: "geojson", data: geojson });
      for (const def of layerDefs) map.addLayer({ ...def, source: OVERLAYS[key].source });
    };

    const LAYER_DEFS = {
      route: [
        { id: "route", type: "line", paint: { "line-color": "#d33", "line-width": 4 } },
      ],
      iso: [
        { id: "iso-fill",    type: "fill", paint: { "fill-color": "#22a", "fill-opacity": 0.2 } },
        { id: "iso-outline", type: "line", paint: { "line-color": "#22a", "line-width": 2 } },
      ],
      ovp: [
        { id: "ovp-lines",  type: "line",   filter: ["==", ["geometry-type"], "LineString"],
          paint: { "line-color": "#093", "line-width": 2 } },
        { id: "ovp-points", type: "circle", filter: ["==", ["geometry-type"], "Point"],
          paint: { "circle-radius": 5, "circle-color": "#093", "circle-stroke-color": "#fff", "circle-stroke-width": 1 } },
      ],
      tour: [
        { id: "tour-line",  type: "line",   filter: ["==", ["geometry-type"], "LineString"],
          paint: { "line-color": "#a05", "line-width": 4, "line-opacity": 0.85 } },
        { id: "tour-stops", type: "circle", filter: ["==", ["geometry-type"], "Point"],
          paint: { "circle-radius": 7, "circle-color": "#a05", "circle-stroke-color": "#fff", "circle-stroke-width": 2 } },
      ],
    };
    // The "ovp" overlay holds whatever the user's last Overpass-y call
    // returned (manual button, /chat overpass_query / nearest_amenity /
    // amenity_pairs). The right-hand POI panel filters this set by the
    // current viewport.
    let lastOvpFeatures = [];
    const drawOverlay = (kind, geojson) => {
      setOverlay(kind, geojson, LAYER_DEFS[kind]);
      if (kind === "ovp") {
        lastOvpFeatures = (geojson && geojson.features) || [];
        renderPoiPanel();
      }
    };

    document.getElementById("clear-btn").onclick = () => {
      fromLngLat = toLngLat = null;
      fromInput.value = toInput.value = "";
      if (fromMarker) { fromMarker.remove(); fromMarker = null; }
      if (toMarker) { toMarker.remove(); toMarker = null; }
      for (const k of Object.keys(OVERLAYS)) removeOverlay(k);
      lastOvpFeatures = [];
      renderPoiPanel();
      setStatus("");
    };

    // ── 1. Route ─────────────────────────────────────────────────
    document.getElementById("route-btn").onclick = async () => {
      const a = parsePt(fromInput.value), b = parsePt(toInput.value);
      if (!a || !b) return setStatus("Set both points first.", true);
      setStatus("Routing…");
      try {
        const res = await fetch("/route", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ points: [a, b], profile: profileVal(), points_encoded: false }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const path = (await res.json()).paths?.[0];
        if (!path) throw new Error("no path");
        drawOverlay("route", { type: "Feature", geometry: path.points });
        setStatus(`${(path.distance / 1000).toFixed(2)} km, ${(path.time / 60000).toFixed(1)} min`);
        if (path.bbox) map.fitBounds([[path.bbox[0], path.bbox[1]], [path.bbox[2], path.bbox[3]]], { padding: 60 });
      } catch (err) { setStatus(err.message, true); }
    };

    // ── 2. Isochrone ─────────────────────────────────────────────
    document.getElementById("iso-btn").onclick = async () => {
      const a = parsePt(fromInput.value);
      if (!a) return setStatus("Set From first.", true);
      const minutes = parseFloat(document.getElementById("minutes").value);
      if (!minutes || minutes <= 0) return setStatus("Enter minutes.", true);
      setStatus("Computing isochrone…");
      try {
        const res = await fetch("/route/isochrone", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat: a[0], lon: a[1], profile: profileVal(), time_limit: Math.round(minutes * 60), buckets: 1 }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        const polys = data.polygons || [];
        if (!polys.length) throw new Error("no polygons returned");
        drawOverlay("iso", { type: "FeatureCollection", features: polys });
        setStatus(`${minutes} min reachable area`);
      } catch (err) { setStatus(err.message, true); }
    };

    // ── 3. Overpass ──────────────────────────────────────────────
    document.getElementById("ovp-btn").onclick = async () => {
      let ql = document.getElementById("ql").value.trim();
      if (!ql) return setStatus("Enter an Overpass QL query.", true);
      // Substitute {{bbox}} with the current map view (Overpass order: south,west,north,east)
      const b = map.getBounds();
      ql = ql.replaceAll("{{bbox}}", `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`);
      setStatus("Querying Overpass…");
      try {
        const res = await fetch("/overpass/query", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: ql, output: "json" }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        const fc = elementsToFeatureCollection(data.elements || []);
        drawOverlay("ovp", fc);
        setStatus(`${fc.features.length} feature${fc.features.length === 1 ? "" : "s"}`);
      } catch (err) { setStatus(err.message, true); }
    };

    // Minimal Overpass→GeoJSON: nodes → Point; ways/relations with `out geom;` → LineString.
    function elementsToFeatureCollection(elements) {
      const features = [];
      for (const el of elements) {
        if (el.type === "node" && el.lat != null && el.lon != null) {
          features.push({ type: "Feature", properties: el.tags || {},
            geometry: { type: "Point", coordinates: [el.lon, el.lat] } });
        } else if (el.geometry && Array.isArray(el.geometry)) {
          features.push({ type: "Feature", properties: el.tags || {},
            geometry: { type: "LineString", coordinates: el.geometry.map(g => [g.lon, g.lat]) } });
        }
      }
      return { type: "FeatureCollection", features };
    }

    function profileVal() { return document.getElementById("profile").value; }

    // ── 4. Chat ──────────────────────────────────────────────────
    const chatHistory = [];
    const chatLog = document.getElementById("chat-log");
    const chatInput = document.getElementById("chat-input");
    const appendMsg = (cls, label, text) => {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.innerHTML = `<b>${label}:</b> ${escapeHtml(text)}`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    };

    const appendToolCall = (call) => {
      const args = JSON.stringify(call.arguments || {});
      const tail = call.error
        ? `<span class="err">error: ${escapeHtml(call.error)}</span>`
        : `<span class="res">${escapeHtml(JSON.stringify(call.result || {}))}</span>`;
      const div = document.createElement("div");
      div.className = "tool";
      div.innerHTML =
        `<span class="name">${escapeHtml(call.name)}</span>(${escapeHtml(args)})\n→ ${tail}`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    };

    async function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      chatHistory.push({ role: "user", content: text });
      appendMsg("you", "you", text);
      setStatus("Thinking…");
      try {
        const b = map.getBounds();
        const res = await fetch("/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: chatHistory,
            bbox: [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()],
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();
        for (const call of data.trace || []) appendToolCall(call);
        chatHistory.push({ role: "assistant", content: data.reply });
        appendMsg("bot", "bot", data.reply || "(no reply)");
        for (const ov of data.overlays || []) {
          if (LAYER_DEFS[ov.kind]) drawOverlay(ov.kind, ov.geojson);
        }
        setStatus("");
      } catch (err) {
        appendMsg("err", "err", err.message);
        setStatus(err.message, true);
      }
    }
    document.getElementById("chat-send").onclick = sendChat;
    chatInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });

    // ── 5. POI panel — driven by the last Overpass result ─────────
    // Lists Point features from the current "ovp" overlay (whatever the
    // user's last Overpass query returned) clipped to the visible bbox.
    // Re-renders when the viewport moves OR when a new query lands.
    const poiList = document.getElementById("poi-list");
    const poiCount = document.getElementById("poi-count");
    const poiStatus = document.getElementById("poi-status");

    function renderPoiPanel() {
      poiList.innerHTML = "";
      if (!lastOvpFeatures.length) {
        poiCount.textContent = "";
        poiStatus.textContent = "Run an Overpass query (chat or button) to populate this list";
        return;
      }
      const b = map.getBounds();
      const south = b.getSouth(), west = b.getWest(), north = b.getNorth(), east = b.getEast();
      const visible = [];
      for (const f of lastOvpFeatures) {
        if (f?.geometry?.type !== "Point") continue;  // skip lines for the row list
        const [lon, lat] = f.geometry.coordinates;
        if (lat < south || lat > north || lon < west || lon > east) continue;
        visible.push(f);
      }
      visible.sort((a, b) => {
        const an = a.properties?.name || "";
        const bn = b.properties?.name || "";
        return an.localeCompare(bn);
      });
      poiCount.textContent = `${visible.length} / ${lastOvpFeatures.length}`;
      poiStatus.textContent = visible.length
        ? ""
        : "No matched points in the current viewport — pan to a result, or zoom out";
      for (const f of visible) {
        const p = f.properties || {};
        const [lon, lat] = f.geometry.coordinates;
        const name = p.name || "(unnamed)";
        const kind = p.amenity || p.shop || p.tourism || p.role || p.leisure || "";
        const row = document.createElement("div");
        row.className = "poi-row";
        row.innerHTML = `<div class="name">${escapeHtml(name)}</div><div class="kind">${escapeHtml(kind)}</div>`;
        row.onclick = () => {
          map.flyTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 17) });
          showFeaturePopup({ lng: lon, lat }, p);
        };
        poiList.appendChild(row);
      }
    }

    map.on("moveend", renderPoiPanel);
    map.on("load", renderPoiPanel);
  </script>
</body>
</html>
